# Toucan Dongle Configuration
# Mirroring Totem Dongle behavior

# Enable pointing (trackpad)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Bluetooth Core
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Connection Limits (Matching Totem)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# PHY Compatibility (Xiao only speaks 1M)
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_PHY_CODED=n

# Central Settings
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
