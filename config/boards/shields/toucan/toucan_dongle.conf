# Toucan Dongle Configuration
# Mirroring Totem Dongle behavior

# Enable pointing (trackpad)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Bluetooth Core
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Boost Radio Power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection Limits
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# PHY Compatibility (Xiao only speaks 1M)
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_PHY_CODED=n

# Central Settings - Aggressive Bond Clearing
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
